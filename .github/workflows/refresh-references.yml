name: refresh-references

on:
  schedule:
    # Jan / Apr / Jul / Oct 1 at 17:00 UTC — quarterly cadence.
    # Cron fires the workflow with target="all" so every leg of the
    # matrix runs in parallel.
    - cron: "0 17 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which plugin's references to refresh"
        type: choice
        required: true
        default: all
        options:
          - all
          - federal-debt
          - federal-immigration
          - federal-legal
          - us-wa
          - us-or
          - us-ca
          - us-co
          - us-in
          - us-ny
          - us-oh
          - us-tn
          - us-mi
          - us-az
          - us-ak
          - us-al
          - us-ar
          - us-ct
          - us-de
          - us-fl
          - us-ga
          - us-hi
          - us-ia
          - us-id
          - us-il
          - us-ks
          - us-ky
          - us-la
          - us-ma
          - us-md
          - us-me
          - us-mn
          - us-mo
          - us-ms
          - us-mt
          - us-nc
          - us-nd
          - us-ne
          - us-nh
          - us-nj
          - us-nm
          - us-nv
          - us-ok
          - us-pa
          - us-ri
          - us-sc
          - us-sd
          - us-tx
          - us-ut
          - us-va
          - us-vt
          - us-wi
          - us-wv
          - us-wy

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One run per (workflow, target) so a manual single-target run doesn't
  # cancel an in-flight cron-all run already running other legs.
  group: refresh-references-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

env:
  PR_REVIEWER: codearranger

jobs:
  pick-targets:
    name: Pick targets to refresh
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          # All 50 states + 3 federal plugins. Quarterly cron fires with
          # target="all" so every leg of the matrix runs in parallel.
          case "${TARGET:-all}" in
            all) targets='["federal-debt","federal-immigration","federal-legal","us-wa","us-or","us-ca","us-co","us-in","us-ny","us-oh","us-tn","us-mi","us-az","us-ak","us-al","us-ar","us-ct","us-de","us-fl","us-ga","us-hi","us-ia","us-id","us-il","us-ks","us-ky","us-la","us-ma","us-md","us-me","us-mn","us-mo","us-ms","us-mt","us-nc","us-nd","us-ne","us-nh","us-nj","us-nm","us-nv","us-ok","us-pa","us-ri","us-sc","us-sd","us-tx","us-ut","us-va","us-vt","us-wi","us-wv","us-wy"]' ;;
            federal-debt|federal-immigration|federal-legal|us-wa|us-or|us-ca|us-co|us-in|us-ny|us-oh|us-tn|us-mi|us-az|us-ak|us-al|us-ar|us-ct|us-de|us-fl|us-ga|us-hi|us-ia|us-id|us-il|us-ks|us-ky|us-la|us-ma|us-md|us-me|us-mn|us-mo|us-ms|us-mt|us-nc|us-nd|us-ne|us-nh|us-nj|us-nm|us-nv|us-ok|us-pa|us-ri|us-sc|us-sd|us-tx|us-ut|us-va|us-vt|us-wi|us-wv|us-wy) targets="[\"${TARGET}\"]" ;;
            *) echo "unexpected target: $TARGET" >&2; exit 1 ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh ${{ matrix.target }} references
    needs: pick-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.pick-targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (poppler for pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      # Each pull is its own step with a `timeout-minutes` cap so a
      # slow upstream (e.g. law.cornell.edu/ucc throttling pull_ucc.py)
      # can't sink the whole leg. `continue-on-error: true` lets the
      # rest of the leg's pulls run if one bails. The puller scripts
      # only write output after a unit fully completes, so a timed-out
      # step leaves the existing files untouched.
      #
      # Excluded everywhere:
      #   - pull_ca_statutes.py — known content regression
      #   - pull_co_court_rules.py — TODO (CO court-rules puller not yet implemented)

      # ---- federal — shared corpus consumed by every state plugin ----
      - name: Federal — debt laws
        if: matrix.target == 'federal-debt'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_federal_debt_laws.py

      - name: Federal — Model UCC
        if: matrix.target == 'federal-debt'
        continue-on-error: true
        # 15 min cap: the new throttle-aware defaults in pull_ucc.py use
        # workers=2, jittered backoff, and a 30s cool-off between articles
        # to stay under Cornell LII's rate limit. Total wall time when
        # things go well is 3-5 min; budget covers a couple of retry cycles.
        timeout-minutes: 15
        run: python3 scripts/pull_ucc.py

      # ---- federal-legal — Constitution + USC + CFR index corpus ----
      # This is a reference-only corpus (no verbatim statute pulls; just
      # curated Constitution text + USC title index + CFR title-to-agency
      # map). Quarterly refresh is a no-op confirmation that the corpus
      # is in sync with the source.
      - name: Federal-legal — Constitution + USC + CFR index (no quarterly pull)
        if: matrix.target == 'federal-legal'
        continue-on-error: true
        timeout-minutes: 5
        run: echo "us-federal-legal-corpus is reference-only; no quarterly pull needed"

      # ---- immigration — shared, venue-independent corpus ----
      # INA (8 U.S.C. ch 12) from uscode.house.gov USLM XML and the
      # curated 8 CFR / 22 CFR parts from the eCFR versioner API both
      # come from official, un-gated government endpoints. The FAM puller
      # mirrors verbatim: fam.state.gov omits the Sectigo intermediate from
      # its TLS chain, so the puller AIA-chases it (reads the leaf's AIA
      # "CA Issuers" URL, fetches the intermediate, adds it to the verify
      # bundle) and then crawls the site's JSON TOC API — no proxy needed.
      # `continue-on-error` + the `_file_is_stub` guard mean that if a runner
      # genuinely can't reach fam.state.gov the step preserves the committed
      # verbatim content rather than clobbering it. Case law is not pulled
      # here — it is on-demand per references/legal-data-apis.md.
      - name: Immigration — INA (8 U.S.C. Chapter 12)
        if: matrix.target == 'federal-immigration'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_ina.py

      - name: Immigration — 8 CFR + 22 CFR (curated parts)
        if: matrix.target == 'federal-immigration'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_immigration_cfr.py

      - name: Immigration — FAM (verbatim; AIA-chases the omitted TLS intermediate + crawls the JSON TOC API)
        if: matrix.target == 'federal-immigration'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_fam.py

      # EOIR practice manuals (ICPM + BIA Practice Manual). EOIR renders these
      # client-side (JavaScript) and Akamai-gates the chapter URLs, so the
      # puller writes canonical-URL pointer stubs (the binding rules are the
      # 8 CFR Part 1003/1240/1208 regs pulled by pull_immigration_cfr.py).
      # The _file_is_stub guard preserves any verbatim content a future
      # headless/un-gated run commits.
      - name: Immigration — EOIR practice manuals (ICPM + BIA Practice Manual stubs)
        if: matrix.target == 'federal-immigration'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/pull_eoir_manuals.py

      # ---- US-WA ----
      - name: WA — court rules
        if: matrix.target == 'us-wa'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 scripts/pull_court_rules.py --workers 12 \
            --manifest plugins/us-wa-legal-corpus/skills/wa-law-references/references/court-rules/_manifest.json

      - name: WA — RCW debt chapters
        if: matrix.target == 'us-wa'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_wa_rcw.py --workers 12

      # ---- US-OR ----
      # Federal + UCC content for OR comes from the shared `federal`
      # target. The OR-specific pullers below refresh the Oregon-only
      # corpora (ORS chapters and the seven OR court-rule canonical
      # sources).
      - name: OR — court rules
        if: matrix.target == 'us-or'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_oregon_rules.py

      - name: OR — ORS debt + civil-practice chapters
        if: matrix.target == 'us-or'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_oregon_ors.py --workers 4

      # ---- US-CA ----
      - name: CA — court rules
        if: matrix.target == 'us-ca'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_ca_court_rules.py --workers 8

      # ---- US-CO ----
      - name: CO — statute corpus (titles 4, 5, 6, 13, 14, 24)
        if: matrix.target == 'us-co'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_co_statutes.py --workers 4

      - name: CO — court rules (Chief Justice Directives + paywalled-rule stubs)
        if: matrix.target == 'us-co'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_co_court_rules.py --workers 4

      # ---- US-IN ----
      # Indiana's five state-wide rule sets (Trial, Evidence, Appellate,
      # Professional Conduct, Administrative) plus Marion County and Lake
      # County local-rule PDFs all come from rules.incourts.gov and
      # in.gov/courts/files. The statute puller targets the IGA Hypermedia
      # API at api.iga.in.gov; when the `IGA_API_KEY` secret is unset (the
      # current state) the script emits well-formed stubs so the corpus
      # mirrors the article shape until access is wired in.
      - name: IN — court rules (state-wide + Marion/Lake local rules)
        if: matrix.target == 'us-in'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_indiana_rules.py --workers 4

      - name: IN — Indiana Code (civil-practice articles)
        if: matrix.target == 'us-in'
        continue-on-error: true
        timeout-minutes: 15
        env:
          IGA_API_KEY: ${{ secrets.IGA_API_KEY }}
        run: python3 scripts/pull_indiana_statutes.py --workers 4

      # ---- US-NY ----
      # New York's trial-court rules (22 NYCRR Parts 130, 202, 202.70,
      # 208, 210, 212, 214, 1200) are published on www.nycourts.gov,
      # which sits behind Cloudflare's managed-challenge gate. The
      # court-rules puller tries the canonical URLs first and falls
      # back to pointer stubs when the upstream returns an
      # interstitial — mirrors the CO court-rules puller's discipline.
      # The statutes puller hits the NY State Senate Open Legislation
      # API at legislation.nysenate.gov; when the `NYSENATE_API_KEY`
      # secret is unset (the current state) the script emits well-
      # formed pointer stubs so the corpus retains its target shape
      # until access is wired in. Mirrors the IN statutes puller.
      - name: NY — court rules (22 NYCRR civil practice + Comm Div + sanctions)
        if: matrix.target == 'us-ny'
        continue-on-error: true
        timeout-minutes: 15
        # No `NY_RULES_PROXY` here on purpose. The proxy referenced
        # by that env var is a developer-local Cloudflare-Warp HTTP
        # endpoint (on a LAN address); GitHub Actions runners can't
        # reach it. The puller falls back to stubs when Cloudflare
        # blocks the runner — but the per-file "don't regress
        # substantive content to a stub" check (`_file_is_stub`)
        # keeps any verbatim content already committed to the repo
        # in place. So the worst case for a CI refresh is a `Fetched:`
        # date bump with no real change. Operators wanting a fresh
        # verbatim pull should run the puller locally with their
        # `NY_RULES_PROXY` set.
        run: |
          pip3 install --break-system-packages curl_cffi
          python3 scripts/pull_ny_court_rules.py --workers 4

      - name: NY — consolidated laws (CPLR + GOB + GBS + RPAPL + UCC + DRL + GCN + BNK)
        if: matrix.target == 'us-ny'
        continue-on-error: true
        timeout-minutes: 15
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: python3 scripts/pull_ny_statutes.py --workers 4

      # ---- US-OH ----
      # Ohio's court rules + statutes are both published on
      # public-access government sites with no Cloudflare gate
      # and no API-key requirement:
      #   - Supreme Court of Ohio (`supremecourt.ohio.gov`)
      #     publishes 14 rule-of-court PDFs at predictable URLs;
      #     pdftotext extracts them. Civ. R. + Evid. R. + Sup. R.
      #     + Prof. Cond. R. etc.
      #   - Ohio Legislative Service Commission (`codes.ohio.gov`)
      #     publishes the Revised Code as HTML chapter pages with
      #     section bodies inline. The puller fetches 20 chapters
      #     (R.C. Chapter 1 + 1302/1303/1309 UCC + 1345 CSPA +
      #     2151/2305/2329/2333 civil enforcement + 3105/3109/3113/
      #     3115/3119/3127 family + 5321/1923 L&T + 1901/1907/1925
      #     court-specific procedural).
      - name: OH — court rules (Civ. R. + Evid. R. + Sup. R. + Prof. Cond. R. + 10 others)
        if: matrix.target == 'us-oh'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_ohio_court_rules.py --workers 3

      - name: OH — Revised Code (20 chapters covering civil + family practice)
        if: matrix.target == 'us-oh'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_ohio_statutes.py --workers 4

      # ---- US-TN ----
      # Tennessee's statewide rule sets are published as Drupal HTML
      # at tncourts.gov — one HTML sub-page per rule, with the rule
      # body inside a `field--name-field-rules-rule-content` div.
      # The court-rules puller walks each rule set's landing page,
      # discovers sub-page URLs by path prefix, and aggregates one
      # MD file per rule set.
      #
      # The Tennessee Code is published officially by LexisNexis
      # under copyright (no clean structured free authoritative
      # source). The statute puller targets the Justia mirror at
      # `law.justia.com/codes/tennessee/`. Justia sits behind
      # Cloudflare bot-fight mode that fingerprints the TLS
      # handshake; stdlib urllib gets a 403 even from a residential
      # IP. The puller uses `curl_cffi` with Chrome TLS
      # impersonation when available — installed below before the
      # statutes step. GitHub Actions runner IPs occasionally pass
      # Cloudflare's IP-reputation check and occasionally don't; the
      # step is `continue-on-error: true` and the puller falls back
      # to well-formed pointer stubs when fetch fails. The
      # `_file_is_stub` regression guard keeps any verbatim content
      # already committed in place — so the worst case for a CI
      # refresh is a `Fetched:` date bump with no real change.
      # Operators wanting a guaranteed-fresh verbatim pull should
      # run the puller locally from a residential or VPN-routed IP.
      - name: TN — court rules (TRCP + TRE + TRAP + Tenn. Sup. Ct. R.)
        if: matrix.target == 'us-tn'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/pull_tn_court_rules.py --workers 2

      - name: TN — Tenn. Code Ann. (25 chapters covering civil + family practice)
        if: matrix.target == 'us-tn'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip3 install --break-system-packages curl_cffi
          python3 scripts/pull_tn_statutes.py --workers 4

      # ---- US-MI ----
      # Michigan Compiled Laws come from legislature.mi.gov (ungated HTML; the
      # objectName per-section scheme), so the statutes puller mirrors verbatim.
      # The Michigan Court Rules / Rules of Evidence are gated on the canonical
      # courts.michigan.gov (hash-rotated asset URLs), so the rules puller mirrors
      # them verbatim from courtrules.net (walking chapter -> subchapter -> rule),
      # falling back to canonical-URL pointer stubs only when that mirror is
      # unreachable; the _file_is_stub guard preserves committed verbatim content.
      - name: MI — Michigan Compiled Laws (curated civil + family + consumer sections)
        if: matrix.target == 'us-mi'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_michigan_statutes.py

      - name: MI — Michigan Court Rules + Rules of Evidence (verbatim where reachable, else stubs)
        if: matrix.target == 'us-mi'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_michigan_rules.py

      # ---- US-AZ ----
      # Arizona Revised Statutes come from azleg.gov (ungated per-section HTML
      # fragments), so the statutes puller mirrors verbatim. The Arizona court
      # rules (Ariz. R. Civ. P., Ariz. R. Evid., Arizona Rules of Family Law
      # Procedure, Justice Court Rules) are gated on the canonical azcourts.gov,
      # so the rules puller mirrors them verbatim from the courtrules.net mirror
      # (walking its index → rule pages), falling back to canonical-URL pointer
      # stubs only when the mirror is unreachable; the _file_is_stub guard
      # preserves committed verbatim content.
      - name: AZ — Arizona Revised Statutes (curated civil + family + consumer sections)
        if: matrix.target == 'us-az'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_arizona_statutes.py

      - name: AZ — Arizona court rules (Ariz. R. Civ. P. + Evid. + Family Law Proc. + Justice Court)
        if: matrix.target == 'us-az'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/pull_arizona_rules.py

      # ---- Newly scaffolded states (40 remaining) ----
      # Each of these is a scaffold-only plugin today; no puller script
      # yet. The step below is a no-op that succeeds, registering the
      # plugin with the quarterly refresh pipeline so that future
      # additions of pull scripts will be exercised automatically by the
      # next cron run. When a state-specific puller is added (e.g.
      # scripts/pull_texas_statutes.py), the corresponding `run:` line
      # below can be updated to invoke it.
      - name: AK — pull state codes
        if: matrix.target == 'us-ak'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ak --max-titles 10

      - name: AL — pull state codes
        if: matrix.target == 'us-al'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state al --max-titles 10

      - name: AR — pull state codes
        if: matrix.target == 'us-ar'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ar --max-titles 10

      - name: CT — pull state codes
        if: matrix.target == 'us-ct'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ct --max-titles 10

      - name: DE — pull state codes
        if: matrix.target == 'us-de'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state de --max-titles 10

      - name: FL — pull state codes
        if: matrix.target == 'us-fl'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state fl --max-titles 10

      - name: GA — pull state codes
        if: matrix.target == 'us-ga'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ga --max-titles 10

      - name: HI — pull state codes
        if: matrix.target == 'us-hi'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state hi --max-titles 10

      - name: IA — pull state codes
        if: matrix.target == 'us-ia'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ia --max-titles 10

      - name: ID — pull state codes
        if: matrix.target == 'us-id'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state id --max-titles 10

      - name: IL — pull state codes
        if: matrix.target == 'us-il'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state il --max-titles 10

      - name: KS — pull state codes
        if: matrix.target == 'us-ks'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ks --max-titles 10

      - name: KY — pull state codes
        if: matrix.target == 'us-ky'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ky --max-titles 10

      - name: LA — pull state codes
        if: matrix.target == 'us-la'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state la --max-titles 10

      - name: MA — pull state codes
        if: matrix.target == 'us-ma'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ma --max-titles 10

      - name: MD — pull state codes
        if: matrix.target == 'us-md'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state md --max-titles 10

      - name: ME — pull state codes
        if: matrix.target == 'us-me'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state me --max-titles 10

      - name: MN — pull state codes
        if: matrix.target == 'us-mn'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state mn --max-titles 10

      - name: MO — pull state codes
        if: matrix.target == 'us-mo'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state mo --max-titles 10

      - name: MS — pull state codes
        if: matrix.target == 'us-ms'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ms --max-titles 10

      - name: MT — pull state codes
        if: matrix.target == 'us-mt'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state mt --max-titles 10

      - name: NC — pull state codes
        if: matrix.target == 'us-nc'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nc --max-titles 10

      - name: ND — pull state codes
        if: matrix.target == 'us-nd'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nd --max-titles 10

      - name: NE — pull state codes
        if: matrix.target == 'us-ne'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ne --max-titles 10

      - name: NH — pull state codes
        if: matrix.target == 'us-nh'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nh --max-titles 10

      - name: NJ — pull state codes
        if: matrix.target == 'us-nj'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nj --max-titles 10

      - name: NM — pull state codes
        if: matrix.target == 'us-nm'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nm --max-titles 10

      - name: NV — pull state codes
        if: matrix.target == 'us-nv'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state nv --max-titles 10

      - name: OK — pull state codes
        if: matrix.target == 'us-ok'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ok --max-titles 10

      - name: PA — pull state codes
        if: matrix.target == 'us-pa'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state pa --max-titles 10

      - name: RI — pull state codes
        if: matrix.target == 'us-ri'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ri --max-titles 10

      - name: SC — pull state codes
        if: matrix.target == 'us-sc'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state sc --max-titles 10

      - name: SD — pull state codes
        if: matrix.target == 'us-sd'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state sd --max-titles 10

      - name: TX — pull state codes
        if: matrix.target == 'us-tx'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state tx --max-titles 10

      - name: UT — pull state codes
        if: matrix.target == 'us-ut'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state ut --max-titles 10

      - name: VA — pull state codes
        if: matrix.target == 'us-va'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state va --max-titles 10

      - name: VT — pull state codes
        if: matrix.target == 'us-vt'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state vt --max-titles 10

      - name: WI — pull state codes
        if: matrix.target == 'us-wi'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state wi --max-titles 10

      - name: WV — pull state codes
        if: matrix.target == 'us-wv'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state wv --max-titles 10

      - name: WY — pull state codes
        if: matrix.target == 'us-wy'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/pull_state_codes.py --state wy --max-titles 10

      # ---- FINALIZE ----

      - name: Lint after refresh
        run: python3 scripts/lint-skills.py

      - name: Compute diff scope
        id: scope
        env:
          T: ${{ matrix.target }}
        run: |
          case "$T" in
            federal-debt)         path='plugins/us-federal-debt-corpus/references/**' ;;
            federal-immigration)  path='plugins/us-federal-immigration-corpus/references/**' ;;
            federal-legal)        path='plugins/us-federal-legal-corpus/references/**' ;;
            us-wa)  path='plugins/us-wa-legal-corpus/references/**' ;;
            us-or)  path='plugins/us-or-legal-corpus/references/**' ;;
            us-ca)  path='plugins/us-ca-legal-corpus/references/**' ;;
            us-co)  path='plugins/us-co-legal-corpus/references/**' ;;
            us-in)  path='plugins/us-in-legal-corpus/references/**' ;;
            us-ny)  path='plugins/us-ny-legal-corpus/references/**' ;;
            us-oh)  path='plugins/us-oh-legal-corpus/references/**' ;;
            us-tn)  path='plugins/us-tn-legal-corpus/references/**' ;;
            us-mi)  path='plugins/us-mi-legal-corpus/references/**' ;;
            us-az)  path='plugins/us-az-legal-corpus/references/**' ;;
            us-ak)  path='plugins/us-ak-legal-corpus/references/**' ;;
            us-al)  path='plugins/us-al-legal-corpus/references/**' ;;
            us-ar)  path='plugins/us-ar-legal-corpus/references/**' ;;
            us-ct)  path='plugins/us-ct-legal-corpus/references/**' ;;
            us-de)  path='plugins/us-de-legal-corpus/references/**' ;;
            us-fl)  path='plugins/us-fl-legal-corpus/references/**' ;;
            us-ga)  path='plugins/us-ga-legal-corpus/references/**' ;;
            us-hi)  path='plugins/us-hi-legal-corpus/references/**' ;;
            us-ia)  path='plugins/us-ia-legal-corpus/references/**' ;;
            us-id)  path='plugins/us-id-legal-corpus/references/**' ;;
            us-il)  path='plugins/us-il-legal-corpus/references/**' ;;
            us-ks)  path='plugins/us-ks-legal-corpus/references/**' ;;
            us-ky)  path='plugins/us-ky-legal-corpus/references/**' ;;
            us-la)  path='plugins/us-la-legal-corpus/references/**' ;;
            us-ma)  path='plugins/us-ma-legal-corpus/references/**' ;;
            us-md)  path='plugins/us-md-legal-corpus/references/**' ;;
            us-me)  path='plugins/us-me-legal-corpus/references/**' ;;
            us-mn)  path='plugins/us-mn-legal-corpus/references/**' ;;
            us-mo)  path='plugins/us-mo-legal-corpus/references/**' ;;
            us-ms)  path='plugins/us-ms-legal-corpus/references/**' ;;
            us-mt)  path='plugins/us-mt-legal-corpus/references/**' ;;
            us-nc)  path='plugins/us-nc-legal-corpus/references/**' ;;
            us-nd)  path='plugins/us-nd-legal-corpus/references/**' ;;
            us-ne)  path='plugins/us-ne-legal-corpus/references/**' ;;
            us-nh)  path='plugins/us-nh-legal-corpus/references/**' ;;
            us-nj)  path='plugins/us-nj-legal-corpus/references/**' ;;
            us-nm)  path='plugins/us-nm-legal-corpus/references/**' ;;
            us-nv)  path='plugins/us-nv-legal-corpus/references/**' ;;
            us-ok)  path='plugins/us-ok-legal-corpus/references/**' ;;
            us-pa)  path='plugins/us-pa-legal-corpus/references/**' ;;
            us-ri)  path='plugins/us-ri-legal-corpus/references/**' ;;
            us-sc)  path='plugins/us-sc-legal-corpus/references/**' ;;
            us-sd)  path='plugins/us-sd-legal-corpus/references/**' ;;
            us-tx)  path='plugins/us-tx-legal-corpus/references/**' ;;
            us-ut)  path='plugins/us-ut-legal-corpus/references/**' ;;
            us-va)  path='plugins/us-va-legal-corpus/references/**' ;;
            us-vt)  path='plugins/us-vt-legal-corpus/references/**' ;;
            us-wi)  path='plugins/us-wi-legal-corpus/references/**' ;;
            us-wv)  path='plugins/us-wv-legal-corpus/references/**' ;;
            us-wy)  path='plugins/us-wy-legal-corpus/references/**' ;;
            *)                  echo "unexpected target: $T" >&2; exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # PR body built into /tmp/pr-body.md so command output (git diff)
      # never lands in a template / shell-eval context — no injection
      # surface from file names or paths.
      - name: Build PR body
        env:
          DIFF_PATH: ${{ steps.scope.outputs.path }}
        run: |
          {
            echo "Automated refresh of **\`${TARGET}\`** references."
            echo
            echo "Triggered by: \`${{ github.event_name }}\`"
            echo
            echo "## Diff summary"
            echo
            echo '```'
            git -c color.ui=never diff --stat -- "$DIFF_PATH" | tail -200
            echo '```'
            echo
            echo "## Reviewer checklist — @${PR_REVIEWER}"
            echo
            echo "- [ ] Diff is a routine pull (no unexpected deletions or extractor regressions)."
            echo "- [ ] Decide PATCH vs MINOR version bump for affected SKILL.md / plugin.json per CLAUDE.md \"Reference-corpus refresh discipline\"."
            echo "- [ ] Spot-check one updated rule or statute for verbatim source fidelity before merging."
            echo
            echo "---"
            echo "🤖 Generated by \`.github/workflows/refresh-references.yml\`. Triggers: cron \`0 17 1 1,4,7,10 *\` (all targets) and manual \`workflow_dispatch\` (per-target selector)."
          } > /tmp/pr-body.md

      - name: Open PR for ${{ matrix.target }} refresh
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/refresh-${{ matrix.target }}-${{ env.RUN_ID }}
          delete-branch: true
          commit-message: |
            chore(refs): refresh ${{ matrix.target }} reference corpora

            Automated refresh of ${{ matrix.target }} content via the
            quarterly refresh-references workflow.
          title: "chore(refs): refresh ${{ matrix.target }} reference corpora"
          assignees: ${{ env.PR_REVIEWER }}
          reviewers: ${{ env.PR_REVIEWER }}
          labels: |
            auto-refresh
            references
            target:${{ matrix.target }}
          body-path: /tmp/pr-body.md
